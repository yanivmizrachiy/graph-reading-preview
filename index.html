<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>קריאת גרפים — מאגר שאלות מהקל לקשה</title>
<link rel="stylesheet" href="assets/worksheet.css">
<style>
  .preview-loading{font-family:Rubik,Arial,sans-serif;direction:rtl;text-align:center;padding:48px;color:#334155}
</style>
</head>
<body>
<div class="preview-loading">טוען את מאגר קריאת הגרפים…</div>
<script>
(async () => {
  try {
    const response = await fetch('מאגר-מלא.html?v=20260902-7', { cache: 'no-store' });
    if (!response.ok) throw new Error('master load failed');
    const html = await response.text();
    const parsed = new DOMParser().parseFromString(html, 'text/html');
    document.body.innerHTML = parsed.body.innerHTML;

    const scripts = [
      'assets/layout-fixes.js?v=20260902-7',
      'assets/progression-fixes.js?v=20260902-7',
      'assets/early-probability-fix.js?v=20260902-7',
      'assets/answer-flow-fixes.js?v=20260902-7',
      'assets/space-balance-fixes.js?v=20260902-7'
    ];

    for (const src of scripts) {
      await new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = src;
        script.onload = resolve;
        script.onerror = reject;
        document.body.appendChild(script);
      });
    }
  } catch (error) {
    document.body.innerHTML = '<div class="preview-loading">לא ניתן לטעון כרגע את המאגר. נסו לרענן את הדף.</div>';
    console.error(error);
  }
})();
</script>
</body>
</html>
