<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="graph-reading-release" content="graph-reading-20260904-cover-first" />
  <meta name="theme-color" content="#fffdf6" />
  <title>קריאת גרפים</title>
  <meta name="description" content="חוברת עבודה בקריאת גרפים — דפדוף, הורדה והדפסה." />
  <link rel="stylesheet" href="assets/fonts/rubik.css" />
  <link rel="stylesheet" href="graph-reading-workbook.css?v=graph-reading-20260904-cover-first" />
  <style>
    .page-toolbar{
      display:flex!important;
      flex-wrap:nowrap!important;
      align-items:center!important;
      justify-content:center!important;
      gap:5px!important;
      min-height:40px!important;
      padding:4px 7px!important;
      background:#fffdf6!important;
      border:0!important;
      border-bottom:1px solid #d6aa32!important;
      border-radius:0!important;
      box-shadow:none!important;
    }
    .page-toolbar .button,.page-toolbar .page-button,.page-toolbar .print-option{
      min-height:29px!important;
      padding:4px 8px!important;
      border:0!important;
      border-radius:7px!important;
      background:transparent!important;
      color:#11203c!important;
      font-size:11px!important;
      font-weight:700!important;
    }
    .page-toolbar .button:hover,.page-toolbar .page-button:hover:not(:disabled){background:#f3e5ad!important}
    .page-toolbar .page-jump{display:inline-flex!important;align-items:center!important;gap:4px!important;padding:2px 6px!important;border-radius:7px!important;background:#f7f3e5!important;color:#11203c!important;font-size:10px!important;white-space:nowrap!important}
    .page-toolbar .page-jump input{width:45px!important;min-height:27px!important;padding:2px 4px!important;border:0!important;border-radius:6px!important;background:#fff!important;font-size:11px!important}
    .page-toolbar .toolbar-actions{display:flex!important;align-items:center!important;justify-content:center!important;gap:2px!important;flex-wrap:nowrap!important}
    .print-menu{font-size:11px!important}
    @media(max-width:640px){
      .page-toolbar{min-height:38px!important;gap:2px!important;padding:3px 4px!important;overflow-x:auto!important;justify-content:flex-start!important}
      .page-toolbar .button,.page-toolbar .page-button{min-height:28px!important;padding:3px 6px!important;font-size:10px!important;white-space:nowrap!important}
      .page-toolbar .page-jump{font-size:9px!important;flex:0 0 auto!important}
      .page-toolbar .page-jump input{width:38px!important;min-height:25px!important;font-size:10px!important}
      .page-toolbar .toolbar-actions{flex:0 0 auto!important;width:auto!important;display:flex!important;gap:1px!important}
      .page-toolbar .toolbar-actions .button,.page-toolbar .toolbar-actions .print-menu-wrap,.page-toolbar .toolbar-actions .print-menu-wrap>.button{width:auto!important}
    }
  </style>
</head>
<body>
  <main class="workbook-shell">
    <section id="viewerPanel" class="viewer-panel" aria-label="תצוגת החוברת">
      <div class="page-toolbar" role="group" aria-label="פעולות וניווט בחוברת">
        <button id="prevPage" class="page-button" type="button">◄ הקודם</button>
        <label class="page-jump" for="pageNumber"><span>עמוד</span><input id="pageNumber" type="number" min="1" max="165" value="1" inputmode="numeric" /><span>מתוך <b id="pageCount">165</b></span></label>
        <button id="nextPage" class="page-button" type="button">הבא ►</button>
        <div class="toolbar-actions">
          <div class="print-menu-wrap"><button id="printButton" class="button primary" type="button" aria-expanded="false" aria-controls="printMenu">הדפסה</button><div id="printMenu" class="print-menu" role="menu" hidden><button id="printColor" class="print-option" type="button" role="menuitem">הדפסה צבעונית</button><button id="printBw" class="print-option" type="button" role="menuitem">הדפסה שחור־לבן</button></div></div>
          <a id="downloadButton" class="button" href="#" download>PDF</a>
          <button id="fullscreenButton" class="button" type="button">מסך מלא</button>
        </div>
      </div>
      <iframe id="bookFrame" title="קריאת גרפים — חוברת עבודה" loading="eager" allow="fullscreen"></iframe>
      <div id="viewerFallback" class="viewer-fallback" hidden><a id="fallbackDownload" class="button primary" href="#" download>הורדת PDF</a></div>
    </section>
  </main>
  <footer class="credits"><strong>יניב רז - מדריך מחוזי חט״ב בעיר ירושלים</strong><span>הדרכה במחוז ירושלים והעיר ירושלים - מנח״י, בהובלת איילת קריספין</span></footer>
  <script src="graph-reading-workbook.js?v=graph-reading-20260904-cover-first"></script>
</body>
</html>
