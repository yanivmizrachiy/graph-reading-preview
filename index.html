<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>קריאת גרפים — מאגר שאלות מהקל לקשה</title>
<link rel="stylesheet" href="assets/worksheet.css">
<style>
  .preview-loading{font-family:Rubik,Arial,sans-serif;direction:rtl;text-align:center;padding:48px;color:#334155}
</style>
</head>
<body>
<div class="preview-loading">טוען את מאגר קריאת הגרפים…</div>
<script>
// שכבת ה-JS שתיקנה בעבר את הדפים בדפדפן הוסרה מהטעינה.
// כל התיקונים האלה הם כיום חוקים במחולל עצמו, והקובץ המוגש כאן הוא
// הפלט הסופי שנבדק: אפס גלישה אנכית ואופקית, אפס חיתוך טקסט ב-SVG
// ומיקום מענה תקין בכל עמוד. הרצה חוזרת של אותם תיקונים על סימון
// שכבר מתוקן הייתה משנה דווקא את הפריסה שאושרה.
// קבצי assets/*-fixes.js נשמרים בהיסטוריה ואינם נטענים.
(async () => {
  try {
    const response = await fetch('מאגר-מלא.html?v=20260902-10', { cache: 'no-store' });
    if (!response.ok) throw new Error('master load failed');
    const html = await response.text();
    const parsed = new DOMParser().parseFromString(html, 'text/html');
    document.body.innerHTML = parsed.body.innerHTML;
  } catch (error) {
    document.body.innerHTML = '<div class="preview-loading">לא ניתן לטעון כרגע את המאגר. נסו לרענן את הדף.</div>';
    console.error(error);
  }
})();
</script>
</body>
</html>
