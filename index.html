<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>קריאת גרפים — מאגר שאלות מהקל לקשה</title>
<link rel="stylesheet" href="assets/worksheet.css">
<style>
  :root{ --bar-blue:#1e40af; --bar-ink:#1f2a44; --bar-line:#d7dee8; }
  body{ background:#eef1f6; }
  .gz-bar{
    position:sticky; top:0; z-index:50;
    background:#fff; border-bottom:2px solid var(--bar-blue);
    box-shadow:0 2px 10px rgba(15,23,42,.10);
    font-family:'Rubik','Segoe UI',Arial,sans-serif; color:var(--bar-ink);
    padding:10px 16px;
  }
  .gz-bar h1{ font-size:17px; font-weight:700; margin:0 0 8px; color:var(--bar-blue); }
  .gz-bar h1 small{ font-weight:400; font-size:13px; color:#5b6b86; margin-inline-start:8px; }
  .gz-row{ display:flex; flex-wrap:wrap; gap:10px 22px; align-items:center; }
  .gz-group{ display:flex; align-items:center; gap:8px; }
  .gz-group > b{ font-size:13.5px; font-weight:600; }
  .gz-bar label{ display:inline-flex; align-items:center; gap:5px; font-size:13.5px; cursor:pointer; }
  .gz-bar input[type=number]{
    width:62px; padding:4px 6px; font:inherit; font-size:13.5px;
    border:1px solid var(--bar-line); border-radius:6px; text-align:center;
  }
  .gz-bar button{
    font:inherit; font-size:13.5px; font-weight:600; cursor:pointer;
    padding:7px 15px; border-radius:8px; border:1px solid var(--bar-blue);
    background:var(--bar-blue); color:#fff;
  }
  .gz-bar button.ghost{ background:#fff; color:var(--bar-blue); }
  .gz-bar button:hover{ filter:brightness(1.08); }
  .gz-count{ font-size:13px; color:#5b6b86; }
  .preview-loading{ font-family:'Rubik',Arial,sans-serif; text-align:center; padding:48px; color:#334155; }

  /* שחור-לבן: הדפים עצמם בלבד, כדי שסרגל הכלים יישאר קריא */
  body.gz-bw .a4-page{ filter:grayscale(100%); }
  /* עמוד שאינו בטווח הנבחר — מוסתר בתצוגה ובהדפסה כאחד */
  .a4-page.gz-skip{ display:none !important; }

  @media print{
    body{ background:#fff; }
    .gz-bar{ display:none !important; }
  }
</style>
</head>
<body>
<div class="gz-bar" id="bar" hidden>
  <h1>קריאת גרפים <small>עבודה על גרפים מחיי היום-יום</small></h1>
  <div class="gz-row">
    <div class="gz-group">
      <b>צבע:</b>
      <label><input type="radio" name="gzcolor" value="color" checked> צבע מלא</label>
      <label><input type="radio" name="gzcolor" value="bw"> שחור-לבן</label>
    </div>
    <div class="gz-group">
      <b>עמודים:</b>
      <label><input type="radio" name="gzrange" value="all" checked> הכול</label>
      <label><input type="radio" name="gzrange" value="some"> מעמוד</label>
      <input type="number" id="from" min="1" value="1" aria-label="מעמוד">
      <span>עד</span>
      <input type="number" id="to" min="1" value="1" aria-label="עד עמוד">
    </div>
    <div class="gz-group">
      <button id="print">הדפסה / שמירה כ-PDF</button>
      <button id="reset" class="ghost">הצגת כל העמודים</button>
    </div>
    <span class="gz-count" id="count"></span>
  </div>
</div>

<div class="preview-loading" id="loading">טוען את מאגר קריאת הגרפים…</div>

<script>
// שכבת ה-JS שתיקנה בעבר את הדפים בדפדפן הוסרה מהטעינה: כל התיקונים האלה
// הם כיום חוקים במחולל עצמו, והקובץ המוגש כאן הוא הפלט הסופי שנבדק.
// קבצי assets/*-fixes.js נשמרים בהיסטוריה ואינם נטענים.
(async () => {
  const loading = document.getElementById('loading');
  const bar = document.getElementById('bar');
  try {
    const response = await fetch('מאגר-מלא.html?v=20260902-14', { cache: 'no-store' });
    if (!response.ok) throw new Error('master load failed');
    const parsed = new DOMParser().parseFromString(await response.text(), 'text/html');
    loading.remove();
    for (const page of [...parsed.body.children]) document.body.appendChild(page);
    bar.hidden = false;

    const pages = [...document.querySelectorAll('.a4-page')];
    const from = document.getElementById('from');
    const to = document.getElementById('to');
    const count = document.getElementById('count');
    from.max = to.max = to.value = pages.length;

    const rangeMode = () => document.querySelector('input[name=gzrange]:checked').value;

    function apply() {
      const all = rangeMode() === 'all';
      let lo = Math.max(1, Math.min(+from.value || 1, pages.length));
      let hi = Math.max(1, Math.min(+to.value || pages.length, pages.length));
      if (lo > hi) { const t = lo; lo = hi; hi = t; }
      let shown = 0;
      pages.forEach((page, i) => {
        const on = all || (i + 1 >= lo && i + 1 <= hi);
        page.classList.toggle('gz-skip', !on);
        if (on) shown++;
      });
      const bw = document.querySelector('input[name=gzcolor]:checked').value === 'bw';
      document.body.classList.toggle('gz-bw', bw);
      count.textContent = 'מוצגים ' + shown + ' מתוך ' + pages.length + ' עמודים · ' +
                          (bw ? 'שחור-לבן' : 'צבע מלא');
    }

    bar.addEventListener('change', apply);
    from.addEventListener('input', apply);
    to.addEventListener('input', apply);
    document.getElementById('print').addEventListener('click', function () { window.print(); });
    document.getElementById('reset').addEventListener('click', function () {
      document.querySelector('input[name=gzrange][value=all]').checked = true;
      from.value = 1; to.value = pages.length;
      apply();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
    apply();
  } catch (error) {
    loading.textContent = 'לא ניתן לטעון כרגע את המאגר. נסו לרענן את הדף.';
    console.error(error);
  }
})();
</script>
</body>
</html>
