<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="graph-reading-release" content="graph-reading-20260904-single-gold-toolbar" />
  <meta name="theme-color" content="#d6aa32" />
  <title>קריאת גרפים</title>
  <meta name="description" content="חוברת עבודה בקריאת גרפים — דפדוף, הורדה והדפסה." />
  <link rel="stylesheet" href="assets/fonts/rubik.css" />
  <link rel="stylesheet" href="graph-reading-workbook.css?v=graph-reading-20260904-single-gold-toolbar" />
  <style>
    .action-bar{display:none!important}
    .page-toolbar{
      display:flex!important;
      flex-wrap:wrap!important;
      align-items:center!important;
      justify-content:center!important;
      gap:8px!important;
      min-height:58px!important;
      padding:9px 10px!important;
      background:linear-gradient(180deg,#ffed9f 0%,#ddb039 100%)!important;
      border:1px solid #b58816!important;
      border-radius:14px!important;
      box-shadow:0 7px 18px rgba(177,134,23,.18)!important;
    }
    .page-toolbar .button,.page-toolbar .page-button,.page-toolbar .print-option{
      min-height:36px!important;
    }
    .page-toolbar .button,.page-toolbar .page-button{
      background:#11203c!important;
      color:#fff!important;
      border-color:#11203c!important;
    }
    .page-toolbar .page-jump{
      background:rgba(255,255,255,.64)!important;
      color:#11203c!important;
      border-radius:10px!important;
      padding:5px 9px!important;
    }
    .page-toolbar .toolbar-actions{
      display:flex;
      flex-wrap:wrap;
      align-items:center;
      justify-content:center;
      gap:8px;
    }
    @media(max-width:640px){
      .page-toolbar{gap:6px!important;padding:7px!important}
      .page-toolbar .toolbar-actions{width:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
      .page-toolbar .toolbar-actions .button,.page-toolbar .toolbar-actions .print-menu-wrap{width:100%}
      .page-toolbar .toolbar-actions .button,.page-toolbar .toolbar-actions .print-menu-wrap>.button{width:100%;font-size:11px;padding-inline:6px}
      .page-toolbar .page-jump{order:-1;width:100%;justify-content:center}
    }
  </style>
</head>
<body>
  <main class="workbook-shell">
    <section id="viewerPanel" class="viewer-panel" aria-label="תצוגת החוברת">
      <div class="page-toolbar" role="group" aria-label="פעולות וניווט בחוברת">
        <button id="prevPage" class="page-button" type="button">◄ הקודם</button>
        <label class="page-jump" for="pageNumber">
          <span>עמוד</span>
          <input id="pageNumber" type="number" min="1" max="165" value="1" inputmode="numeric" />
          <span>מתוך <b id="pageCount">165</b></span>
        </label>
        <button id="nextPage" class="page-button" type="button">הבא ►</button>
        <div class="toolbar-actions">
          <div class="print-menu-wrap">
            <button id="printButton" class="button primary" type="button" aria-expanded="false" aria-controls="printMenu">הדפסה</button>
            <div id="printMenu" class="print-menu" role="menu" hidden>
              <button id="printColor" class="print-option" type="button" role="menuitem">הדפסה צבעונית</button>
              <button id="printBw" class="print-option" type="button" role="menuitem">הדפסה שחור־לבן</button>
            </div>
          </div>
          <a id="downloadButton" class="button" href="#" download>הורדת PDF</a>
          <button id="fullscreenButton" class="button" type="button">מסך מלא</button>
        </div>
      </div>

      <iframe id="bookFrame" title="קריאת גרפים — חוברת עבודה" loading="eager" allow="fullscreen"></iframe>

      <div id="viewerFallback" class="viewer-fallback" hidden>
        <a id="fallbackDownload" class="button primary" href="#" download>הורדת PDF</a>
      </div>
    </section>
  </main>

  <footer class="credits">
    <strong>יניב רז - מדריך מחוזי חט״ב בעיר ירושלים</strong>
    <span>הדרכה במחוז ירושלים והעיר ירושלים - מנח״י, בהובלת איילת קריספין</span>
  </footer>

  <script src="graph-reading-workbook.js?v=graph-reading-20260904-single-gold-toolbar"></script>
</body>
</html>
