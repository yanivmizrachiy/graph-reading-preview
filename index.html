<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="graph-reading-release" content="graph-reading-20260902-clean-viewer" />
  <meta name="theme-color" content="#0f2747" />
  <title>קריאת גרפים</title>
  <meta name="description" content="חוברת עבודה בקריאת גרפים — דפדוף, הורדה והדפסה בצבע או בשחור־לבן." />
  <link rel="stylesheet" href="assets/fonts/rubik.css" />
  <link rel="stylesheet" href="graph-reading-workbook.css?v=graph-reading-20260902-clean-viewer" />
</head>
<body>
  <header class="action-bar" aria-label="פעולות החוברת">
    <div class="mode-switch" role="group" aria-label="בחירת גרסה">
      <button id="colorMode" class="mode is-active" type="button" aria-pressed="true">צבעוני</button>
      <button id="bwMode" class="mode" type="button" aria-pressed="false">שחור־לבן</button>
    </div>
    <a id="downloadButton" class="button primary" href="#" download>הורדת PDF</a>
    <a id="openButton" class="button" href="#" target="_blank" rel="noopener">פתיחה והדפסה</a>
    <button id="fullscreenButton" class="button" type="button">מסך מלא</button>
  </header>

  <main class="workbook-shell">
    <section id="viewerPanel" class="viewer-panel" aria-label="תצוגת החוברת">
      <div class="page-toolbar" role="group" aria-label="ניווט בעמודי החוברת">
        <button id="prevPage" class="page-button" type="button">◄ הקודם</button>
        <label class="page-jump" for="pageNumber">
          <span>עמוד</span>
          <input id="pageNumber" type="number" min="1" max="165" value="1" inputmode="numeric" />
          <span>מתוך <b id="pageCount">165</b></span>
        </label>
        <button id="nextPage" class="page-button" type="button">הבא ►</button>
      </div>

      <iframe id="pdfFrame" title="קריאת גרפים — חוברת עבודה" loading="eager" allow="fullscreen"></iframe>

      <div id="viewerFallback" class="viewer-fallback" hidden>
        <div>
          <a id="fallbackOpen" class="button primary" href="#" target="_blank" rel="noopener">פתיחת החוברת</a>
          <a id="fallbackDownload" class="button" href="#" download>הורדת PDF</a>
        </div>
      </div>
    </section>
  </main>

  <footer class="credits">
    <strong>יניב רז - מדריך מחוזי חט״ב בעיר ירושלים</strong>
    <span>הדרכה במחוז ירושלים והעיר ירושלים - מנח״י, בהובלת איילת קריספין</span>
  </footer>

  <script src="graph-reading-workbook.js?v=graph-reading-20260902-clean-viewer"></script>
</body>
</html>
