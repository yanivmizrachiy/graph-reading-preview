name: Viewer contract

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  viewer-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check viewer source-of-truth contract
        run: node scripts/check-viewer-contract.mjs
