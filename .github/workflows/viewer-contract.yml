name: Viewer contract

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  viewer-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Check viewer source-of-truth contract
        run: node scripts/check-viewer-contract.mjs
